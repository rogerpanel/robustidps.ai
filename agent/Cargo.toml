[workspace]
resolver = "2"
members = ["agent-features", "agent-cli", "agent-netfilter", "agent-edge", "agent-inference"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["RobustIDPS.ai contributors"]
license = "MIT"
repository = "https://github.com/rogerpanel/robustidps.ai"

[workspace.dependencies]
# PCAP parsing (pure Rust, no libpcap dependency)
pcap-parser = "0.16"
# Packet decoding (Ethernet / IPv4 / IPv6 / TCP / UDP / ICMP)
etherparse = "0.16"
# CSV output
csv = "1.3"
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
# Hash map for flow assembly
ahash = "0.8"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
# Logging
log = "0.4"
env_logger = "0.11"
# Iterator helpers
itertools = "0.13"
# Structured serialisation for netfilter command envelopes
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# IP / CIDR validation
ipnet = "2.10"
# Process-spawning helpers and timeouts
which = "7.0"
# Async runtime + gRPC for the edge agent
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util", "net"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
futures = "0.3"
# Live packet capture
pcap = "2.2"
# Config loading
toml = "0.8"
# Hostname resolution for agent identity
hostname = "0.4"
# ONNX Runtime bindings. Pin to exactly rc.10 — rc.11/rc.12 hit a build
# failure on the VitisAI execution provider when the host's libonnxruntime
# is older than that EP. rc.10 is the most recent rc that builds cleanly
# against the libonnxruntime shipped on Debian / Ubuntu 24.04.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
