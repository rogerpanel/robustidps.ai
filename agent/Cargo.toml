[workspace]
resolver = "2"
members = ["agent-features", "agent-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["RobustIDPS.ai contributors"]
license = "MIT"
repository = "https://github.com/rogerpanel/robustidps.ai"

[workspace.dependencies]
# PCAP parsing (pure Rust, no libpcap dependency)
pcap-parser = "0.16"
# Packet decoding (Ethernet / IPv4 / IPv6 / TCP / UDP / ICMP)
etherparse = "0.16"
# CSV output
csv = "1.3"
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
# Hash map for flow assembly
ahash = "0.8"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
# Logging
log = "0.4"
env_logger = "0.11"
# Iterator helpers
itertools = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
