[package]
name = "agent-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "RobustIDPS.ai edge agent: live/replay packet capture, streaming flow assembly, local classifier stub, gRPC up-stream to the control plane"

[lib]
name = "agent_edge"
path = "src/lib.rs"

[[bin]]
name = "robustidps-edge"
path = "src/main.rs"

[features]
default = []
# Enables the OnnxClassifier path via agent-inference. Requires
# libonnxruntime.so on the deploy host (apt-get install onnxruntime, or
# bundle it next to the binary). Without this feature the daemon falls
# back to StubClassifier and ignores any --onnx-model CLI flag.
onnx = ["dep:agent-inference"]

[dependencies]
agent-features = { path = "../agent-features" }
agent-inference = { path = "../agent-inference", optional = true }

tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
prost.workspace = true
futures.workspace = true
pcap.workspace = true
toml.workspace = true
hostname.workspace = true

serde.workspace = true
serde_json.workspace = true
ipnet.workspace = true
sha2.workspace = true
ahash.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "test-util"] }
