apiVersion: v1
kind: Secret
metadata:
  name: robustidps-credentials
type: Opaque
stringData:
  api_key: "rids_live_REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-billing-copilot
  labels:
    robustidps.ai/template: "billing_copilot"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-billing-copilot
  template:
    metadata:
      labels:
        app: agent-billing-copilot
    spec:
      containers:
        - name: agent
          image: ghcr.io/your-org/agent-billing-copilot:latest
          env:
            - name: ROBUSTIDPS_API_BASE
              value: "https://robustidps.ai"
            - name: ROBUSTIDPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: robustidps-credentials
                  key: api_key
            - name: RUNTIME_AGENT_ID
              value: "billing-copilot-prod-eu-1"
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {cpu: "1000m", memory: "1Gi"}
