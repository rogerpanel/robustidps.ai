apiVersion: v1
kind: Secret
metadata:
  name: robustidps-credentials
type: Opaque
stringData:
  api_key: "rids_live_REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-red-team-operator
  labels:
    robustidps.ai/template: "red_team_operator"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-red-team-operator
  template:
    metadata:
      labels:
        app: agent-red-team-operator
    spec:
      containers:
        - name: agent
          image: ghcr.io/your-org/agent-red-team-operator:latest
          env:
            - name: ROBUSTIDPS_API_BASE
              value: "https://robustidps.ai"
            - name: ROBUSTIDPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: robustidps-credentials
                  key: api_key
            - name: RUNTIME_AGENT_ID
              value: "red-team-operator-prod-eu-1"
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {cpu: "1000m", memory: "1Gi"}
