name: aegis-gate

# Eat our own dogfood — every PR runs the AegisAgents Kit's pytest
# plugin against the starter agents to prove the gate works end-to-end.
#
# The job is read-only and offline-friendly: it installs the SDK from
# source, smoke-imports every example agent's main.py, and verifies the
# SDK exports. The full `pytest --aegis-fail-on-warn` invocation runs
# only when the repo has AGENT_STUDIO_DEMO_KEY set (a low-privilege
# key scoped to scanner reads on staging).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scanner-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install SDK from source (with aegis + pytest extras)
        # Don't use the starter requirements.txt — those reference
        # `robustidps[aegis]` which is not on PyPI yet. Install the
        # local SDK editable + the framework deps the starters need.
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk[aegis,pytest]"
          pip install "langgraph>=0.2" "httpx>=0.27"

      - name: Smoke-import every starter agent
        # Skip dirs that don't have a main.py (e.g. _deploy/ templates).
        run: |
          fail=0
          for d in examples/agents/*/; do
            name=$(basename "$d")
            if [ ! -f "$d/main.py" ]; then
              echo "skip $name (no main.py)"
              continue
            fi
            echo "→ smoke-import $name"
            (cd "$d" && python -c "import importlib, sys; sys.path.insert(0, '.'); importlib.import_module('main')") || fail=1
          done
          exit $fail

      - name: Verify SDK exports
        run: |
          python -c "from robustidps.aegis import MambaGuardClient, Verdict, VerdictDecision, SUPPORTED_FRAMEWORKS; \
                     assert len(SUPPORTED_FRAMEWORKS) >= 11, SUPPORTED_FRAMEWORKS; \
                     print(f'OK · SUPPORTED_FRAMEWORKS={len(SUPPORTED_FRAMEWORKS)} entries')"

  aegis-pytest-gate:
    runs-on: ubuntu-latest
    needs: scanner-smoke
    # Job-level `if` cannot reference `secrets.*` directly — surface the
    # secret as env first, then check `env.DEMO_KEY` per step.
    env:
      DEMO_KEY: ${{ secrets.AGENT_STUDIO_DEMO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Skip if no demo key configured
        if: ${{ env.DEMO_KEY == '' }}
        run: echo "AGENT_STUDIO_DEMO_KEY repo secret not set — skipping live gate."

      - name: Install SDK with pytest plugin
        if: ${{ env.DEMO_KEY != '' }}
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e "./sdk[aegis,pytest]"
          pip install "langgraph>=0.2" "httpx>=0.27"

      - name: Run pytest --aegis-fail-on-warn against starter prompts
        if: ${{ env.DEMO_KEY != '' }}
        env:
          ROBUSTIDPS_API_BASE: ${{ vars.ROBUSTIDPS_API_BASE || 'https://robustidps.ai' }}
          ROBUSTIDPS_API_KEY: ${{ env.DEMO_KEY }}
        run: |
          cat > /tmp/test_aegis_starters.py <<'PY'
          import importlib, pathlib, sys, pytest
          ROOT = pathlib.Path("examples/agents")
          STARTERS = [p.name for p in ROOT.iterdir()
                      if p.is_dir() and (p / "main.py").exists()]

          @pytest.mark.parametrize("agent_dir", STARTERS)
          def test_starter_prompt_safe(agent_dir, aegis_assert_safe):
              sys.path.insert(0, str(ROOT / agent_dir))
              try:
                  mod = importlib.import_module("main")
              finally:
                  sys.path.pop(0)
              aegis_assert_safe(mod.SYSTEM_PROMPT, kind="system_prompt")
          PY
          pytest /tmp/test_aegis_starters.py --aegis-fail-on-warn -v
